<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LICENA · Thumbnail</title>
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 900;src:url(fonts/playfair-var.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400 900;src:url(fonts/playfair-italic-var.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;src:url(fonts/inter-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url(fonts/plexmono-600.woff2) format('woff2')}
:root{
  --navy:#1b3b6f; --navy2:#102a52; --navy3:#0b1d3a; --gold:#b8862b; --gold2:#f4d692; --red:#d3453a; --green:#2a9a5e;
  --mono:'IBM Plex Mono',monospace; --serif:'Playfair Display',serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#28509a 0%,var(--navy) 42%,var(--navy3) 100%);color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;width:1500px;height:1500px;border-radius:50%;left:50%;top:38%;margin:-750px 0 0 -750px;background:radial-gradient(circle,rgba(244,214,146,.26) 0%,rgba(244,214,146,0) 60%)}
.grain{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:120px 120px}
.wrap{position:absolute;inset:0;padding:150px 80px 130px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);display:flex;align-items:center;gap:18px}
.kicker .star{color:var(--gold);font-size:1.1em}
.kicker::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,currentColor,transparent);opacity:.5}
h1{font-family:var(--serif);font-weight:900;font-size:188px;line-height:.98;letter-spacing:-.01em;text-shadow:0 12px 40px rgba(0,0,0,.35)}
h1 em{font-style:italic;font-weight:700;color:var(--gold2)}
.stamp{display:inline-block;align-self:flex-start;background:var(--red);color:#fff;font-family:var(--mono);font-weight:600;font-size:50px;letter-spacing:.06em;text-transform:uppercase;padding:22px 36px;border-radius:14px;transform:rotate(-3deg);box-shadow:0 20px 50px rgba(0,0,0,.4);border:4px solid rgba(255,255,255,.85);margin:40px 0 0 6px}
.stamp.gold{background:var(--gold);color:#1b2436}
.stamp.green{background:var(--green)}
.chips{display:flex;gap:18px;flex-wrap:wrap;margin-top:44px}
.chip{font-family:var(--mono);font-size:32px;font-weight:600;border:3px solid rgba(255,255,255,.45);border-radius:999px;padding:14px 30px;background:rgba(255,255,255,.08)}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.lockup{font-family:var(--serif);font-weight:900;font-size:130px;line-height:1;display:flex;align-items:center;gap:20px}
.lockup .star{color:var(--gold);font-size:.75em}
.tag{font-family:var(--mono);font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#c4d0e6;margin-top:14px}
.ac{width:300px;height:auto;flex:none;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.side{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:flex-end;gap:30px}

/* 16:9 */
@media (min-aspect-ratio: 1/1){
  .wrap{padding:60px 90px 56px;flex-direction:row;align-items:center;gap:60px}
  .col{display:flex;flex-direction:column;justify-content:center;gap:0;flex:1}
  .kicker{font-size:22px}
  h1{font-size:98px;margin-top:14px}
  .stamp{font-size:30px;padding:14px 24px;margin-top:26px}
  .chips{margin-top:26px}
  .chip{font-size:22px;padding:9px 20px}
  .side{flex-direction:column;align-items:flex-end;justify-content:space-between;height:100%;flex:none;width:360px}
  .lockup{font-size:84px}
  .tag{font-size:18px;text-align:right}
  .ac{width:240px}
}
</style>
</head>
<body>
<div class="glow"></div><div class="grain"></div>
<div class="wrap">
  <div class="col">
    <div class="kicker"><span class="star">&#9733;</span> California · Arizona · HVAC</div>
    <h1 data-h1></h1>
    <div class="stamp" data-stamp></div>
    <div class="chips"><span class="chip">CSLB · California</span><span class="chip">ROC · Arizona</span></div>
  </div>
  <div class="side">
    <svg class="ac" viewBox="0 0 300 300" fill="none" stroke="#f4d692" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="30" y="40" width="240" height="220" rx="26"/>
      <circle cx="150" cy="150" r="76"/>
      <circle cx="150" cy="150" r="14" fill="#f4d692" stroke="none"/>
      <path d="M150 150 C 120 118, 128 84, 150 74 M150 150 C 182 118, 174 84, 150 74" opacity=".9"/>
      <path d="M150 150 C 118 182, 84 174, 74 150 M150 150 C 118 118, 84 126, 74 150" opacity=".9"/>
      <path d="M150 150 C 182 182, 216 174, 226 150 M150 150 C 182 118, 216 126, 226 150" opacity=".9"/>
      <path d="M150 150 C 118 182, 126 216, 150 226 M150 150 C 182 182, 174 216, 150 226" opacity=".9"/>
      <line x1="56" y1="66" x2="244" y2="66" opacity=".55"/><line x1="56" y1="236" x2="244" y2="236" opacity=".55"/>
      <line x1="70" y1="262" x2="70" y2="286"/><line x1="230" y1="262" x2="230" y2="286"/>
    </svg>
    <div class="foot">
      <div><div class="lockup"><span class="star">&#9733;</span> LICENA</div><div class="tag">Entrenador · examen de contratista</div></div>
    </div>
  </div>
</div>
<script>
const V = {
  pain:    { h1: '¿Trabajas<br>en HVAC<br><em>sin licencia?</em>', stamp: 'Cada trabajo de $1,000+<br>es ilegal', cls: '' },
  benefit: { h1: 'Pasa tu<br>examen<br><em>a la<br>primera</em>', stamp: '500 + 500 preguntas<br>explicación al instante', cls: 'gold' },
};
const v = V[new URLSearchParams(location.search).get('v') || 'pain'];
document.querySelector('[data-h1]').innerHTML = v.h1;
const st = document.querySelector('[data-stamp]'); st.innerHTML = v.stamp; if (v.cls) st.classList.add(v.cls);
</script>
</body>
</html>
